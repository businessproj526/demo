<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IAStune - Course View</title>
  <script src="https://cdn.tailwindcss.com/3.4.17" type="text/javascript"></script>
  <script>
      tailwind.config = {
          darkMode: 'class',
          theme: {
              extend: {
                  animation: {
                      'float': 'float 3s ease-in-out infinite',
                  },
                  keyframes: {
                      float: {
                          '0%, 100%': { transform: 'translateY(0px)' },
                          '50%': { transform: 'translateY(-5px)' }
                      }
                  }
              }
          }
      }
  </script>
  <style>
        /* --- GENERAL RESET & TAILWIND INJECTIONS --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            /* Gradient background from Code 2 */
            background: linear-gradient(to bottom right, #f8fafc, #eff6ff, #eef2ff);
            color: #0f172a;
            height: 100vh;
            overflow: hidden;
            letter-spacing: 0.3px;
        }

        /* Glassmorphism utility */
        .glass-morphism {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        /* --- LAYOUT CONTAINER --- */
        .main-container {
            display: flex;
            height: 100vh;
        }

        /* --- TOP BRAND HEADER --- */
        .brand-header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.8);
            padding: 12px 20px;
            border-radius: 50px;
            border: 1px solid rgba(199, 210, 254, 0.4);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #4f46e5 0%, #2563eb 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: white;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .brand-name {
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 1px;
            background: linear-gradient(to right, #4f46e5, #9333ea, #2563eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* --- LEFT SIDEBAR --- */
        .sidebar {
            width: 320px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid rgba(199, 210, 254, 0.4);
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            margin-top: 70px; /* Adjusted for header */
        }

        .sidebar-header {
            padding: 24px 20px;
            font-weight: 700;
            border-bottom: 1px solid rgba(199, 210, 254, 0.4);
            color: #1e293b;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
        }

        .sidebar-header::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 16px;
            background: linear-gradient(180deg, #4f46e5 0%, #2563eb 100%);
            border-radius: 2px;
            margin-right: 10px;
            vertical-align: middle;
        }

        .lesson-list {
            list-style: none;
            padding: 12px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .lesson-item {
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #475569;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            border: 1px solid transparent;
        }

        .lesson-item:hover {
            background: #eef2ff;
            color: #4f46e5;
            border-color: rgba(199, 210, 254, 0.6);
            transform: translateX(4px);
        }

        .lesson-item.active {
            background: linear-gradient(to right, #e0e7ff, #dbeafe);
            border: 1px solid rgba(199, 210, 254, 0.6);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            font-weight: 700;
            color: #3730a3;
        }

        .circle-indicator {
            height: 10px;
            width: 10px;
            border: 2px solid #cbd5e1;
            border-radius: 50%;
            flex-shrink: 0;
            margin-left: 10px;
            transition: all 0.3s ease;
        }

        .lesson-item.active .circle-indicator {
            background: #4f46e5;
            border-color: #4f46e5;
            box-shadow: 0 0 8px rgba(79, 70, 229, 0.4);
        }

        /* --- RIGHT CONTENT AREA --- */
        .content-area {
            flex-grow: 1;
            padding: 80px 45px 45px 45px;
            overflow-y: auto;
            background: transparent;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .content-title {
            font-size: 32px;
            margin-bottom: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #4f46e5, #9333ea, #2563eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: float 3s ease-in-out infinite;
        }

        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(199, 210, 254, 0.4);
            padding-bottom: 16px;
        }

        .tab-btn {
            padding: 10px 24px;
            border: 1px solid rgba(199, 210, 254, 0.6);
            background: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            backdrop-filter: blur(8px);
        }

        .tab-btn:hover {
            background: #eef2ff;
            color: #4f46e5;
        }

        .tab-btn.active {
            color: white;
            background: linear-gradient(135deg, #4f46e5 0%, #2563eb 100%);
            border-color: transparent;
            box-shadow: 0 8px 16px rgba(79, 70, 229, 0.3);
        }

        /* --- MIND MAP WRAPPER --- */
        .mindmap-wrapper {
            position: relative;
            flex-grow: 1;
            min-height: 600px;
            border: 1px solid rgba(199, 210, 254, 0.5);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(79, 70, 229, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mindmap-wrapper:hover {
            box-shadow: 0 20px 40px rgba(79, 70, 229, 0.15), 0 4px 12px rgba(0, 0, 0, 0.06);
            transform: perspective(1000px) rotateX(1deg) scale(1.01);
        }

        .mindmap-wrapper:fullscreen {
            border-radius: 0;
            border: none;
            width: 100vw;
            height: 100vh;
            box-shadow: none;
            background: #f8fafc;
            transform: none;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 16px;
            transition: border-radius 0.3s ease;
        }
        
        .mindmap-wrapper:fullscreen iframe {
            border-radius: 0;
        }

        /* Fullscreen Button Styling */
        .open-btn {
            position: absolute;
            bottom: 24px;
            right: 24px;
            background: linear-gradient(to right, #4f46e5, #2563eb);
            padding: 12px;
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            z-index: 10;
            border: none;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .open-btn:hover {
            background: linear-gradient(to right, #4338ca, #1d4ed8);
            transform: scale(1.1) translateY(-2px);
            box-shadow: 0 12px 25px rgba(79, 70, 229, 0.5);
        }

        .open-btn:active {
            transform: scale(0.95);
        }

        .open-btn svg {
            stroke: white;
            transition: transform 0.3s ease;
        }

        .open-btn:hover svg {
            transform: rotate(5deg);
        }

        /* --- FOOTER --- */
        .copyright {
            margin-top: 24px;
            color: #94a3b8;
            font-size: 12px;
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.3px;
            transition: color 0.3s ease;
        }

        .copyright:hover {
            color: #4f46e5;
        }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .sidebar { width: 100%; height: auto; max-height: 250px; margin-top: 80px; }
            .content-area { padding: 40px 20px 20px; }
            .content-title { font-size: 24px; }
        }

        /* Scrollbar styling */
        .sidebar::-webkit-scrollbar,
        .content-area::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track,
        .content-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar::-webkit-scrollbar-thumb,
        .content-area::-webkit-scrollbar-thumb {
            background: rgba(199, 210, 254, 0.8);
            border-radius: 10px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover,
        .content-area::-webkit-scrollbar-thumb:hover {
            background: #818cf8;
        }
    </style>
 </head>
 <body>
  <div class="brand-header">
   <div class="brand-logo">
    IA
   </div>
   <div class="brand-name">
    IAStune
   </div>
  </div>
  
  <div class="main-container">
   <div class="sidebar">
    <div class="sidebar-header">
     Geography Modules
    </div>
    <ul class="lesson-list">
     <li class="lesson-item active" onclick="loadMap(this, 'https://www.iastune.in/mind-map/dark', 'Economics, Economy &amp; National Income')">Economics, Economy &amp; National Income <span class="circle-indicator"></span></li>
     <li class="lesson-item" onclick="loadMap(this, 'https://www.iastune.in/mindmaps/geography/3.%20Landforms%20Evolution%20due%20to%20Internal%20Forces', 'Landforms Evolution (Internal Forces)')">Landforms Evolution (Internal Forces) <span class="circle-indicator"></span></li>
     <li class="lesson-item" onclick="loadMap(this, 'https://www.iastune.in/mindmaps/geography/1.%20Interior%20Earth', 'Interior of the Earth')">Interior of the Earth <span class="circle-indicator"></span></li>
     <li class="lesson-item" onclick="loadMap(this, 'https://www.iastune.in/mindmaps/geography/1.%20Physical%20Features', 'Physical Features')">Physical Features <span class="circle-indicator"></span></li>
     <li class="lesson-item" onclick="loadMap(this, 'https://www.iastune.in/mindmaps/geography/2.%20Drainage%20system', 'Drainage System')">Drainage System <span class="circle-indicator"></span></li>
     <li class="lesson-item" onclick="loadMap(this, 'https://www.iastune.in/mindmaps/geography/2.%20Dynamic%20Surface%20of%20Earth', 'Dynamic Surface of Earth')">Dynamic Surface of Earth <span class="circle-indicator"></span></li>     
    </ul>
   </div>

   <div class="content-area">
    <h1 class="content-title" id="page-title">Economics, Economy &amp; National Income</h1>
    <div class="tabs">
        <button class="tab-btn">Article</button> 
        <button class="tab-btn active">Mindmap</button>
    </div>
    <div class="mindmap-wrapper" id="mindmap-container">
        <iframe id="main-frame" src="https://www.iastune.in/mindmaps/geography/Rocks" title="Mindmap" loading="lazy"> </iframe> 
        <button class="open-btn" onclick="toggleFullScreen()" title="Enter Full Screen">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewbox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 3h6v6" />
                <path d="M9 21H3v-6" />
                <path d="M21 3l-7 7" />
                <path d="M3 21l7-7" />
            </svg>
        </button>
    </div>
    <p class="copyright">copyright © iastune.in</p>
   </div>
  </div>

  <script>
    // 1. Function to switch maps
    function loadMap(element, url, title) {
        document.getElementById('main-frame').src = url;
        document.getElementById('page-title').innerText = title;

        var items = document.querySelectorAll('.lesson-item');
        items.forEach(function(item) {
            item.classList.remove('active');
        });
        element.classList.add('active');
    }

    // 2. Full Screen Logic
    function toggleFullScreen() {
        var elem = document.getElementById('mindmap-container');

        if (!document.fullscreenElement) {
            // Enter Full Screen
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        } else {
            // Exit Full Screen
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) { /* Safari */
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) { /* IE11 */
                document.msExitFullscreen();
            }
        }
    }
  </script>
 </body>
</html>

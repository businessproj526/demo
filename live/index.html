<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Analytics Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
        }
        
        .glow {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }
        
        .pulse-dot {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .metric-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.1));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .metric-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="min-h-screen text-white p-6">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-4xl font-bold gradient-text mb-2">Live Analytics Dashboard</h1>
                <p class="text-gray-400">Real-time system monitoring</p>
            </div>
            <div class="text-right">
                <div id="currentTime" class="text-2xl font-semibold text-blue-400"></div>
                <div id="currentDate" class="text-gray-400"></div>
            </div>
        </div>

        <!-- Metrics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- Current Users Online -->
            <div class="metric-card rounded-xl p-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-semibold text-gray-300">Users Online</h3>
                    <div class="pulse-dot w-3 h-3 bg-green-400 rounded-full"></div>
                </div>
                <div class="text-3xl font-bold text-green-400 mb-2" id="usersCount">1,247</div>
                <div class="text-sm text-gray-400">
                    <span id="usersChange" class="text-green-400">+12%</span> from last hour
                </div>
            </div>

            <!-- Machine Performance -->
            <div class="metric-card rounded-xl p-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-semibold text-gray-300">CPU Performance</h3>
                    <div class="pulse-dot w-3 h-3 bg-blue-400 rounded-full"></div>
                </div>
                <div class="text-3xl font-bold text-blue-400 mb-2" id="cpuUsage">67%</div>
                <div class="text-sm text-gray-400">
                    <span id="cpuChange" class="text-blue-400">Normal</span> load average
                </div>
            </div>

            <!-- Bandwidth Speed -->
            <div class="metric-card rounded-xl p-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-semibold text-gray-300">Bandwidth</h3>
                    <div class="pulse-dot w-3 h-3 bg-purple-400 rounded-full"></div>
                </div>
                <div class="text-3xl font-bold text-purple-400 mb-2" id="bandwidth">89.2 Mbps</div>
                <div class="text-sm text-gray-400">
                    <span id="bandwidthChange" class="text-purple-400">+5.2%</span> from baseline
                </div>
            </div>
        </div>

        <!-- Charts Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Users Online Chart -->
            <div class="chart-container rounded-xl p-6">
                <h3 class="text-xl font-semibold mb-4 text-green-400">Users Online Trend</h3>
                <div class="relative h-64">
                    <canvas id="usersChart" class="w-full h-full"></canvas>
                </div>
            </div>

            <!-- Machine Performance Chart -->
            <div class="chart-container rounded-xl p-6">
                <h3 class="text-xl font-semibold mb-4 text-blue-400">CPU Performance</h3>
                <div class="relative h-64">
                    <canvas id="cpuChart" class="w-full h-full"></canvas>
                </div>
            </div>

            <!-- Bandwidth Chart -->
            <div class="chart-container rounded-xl p-6 lg:col-span-2">
                <h3 class="text-xl font-semibold mb-4 text-purple-400">Network Bandwidth</h3>
                <div class="relative h-64">
                    <canvas id="bandwidthChart" class="w-full h-full"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Time and Date Updates
        function updateDateTime() {
            const now = new Date();
            const timeOptions = { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hour12: false 
            };
            const dateOptions = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            };
            
            document.getElementById('currentTime').textContent = now.toLocaleTimeString('en-US', timeOptions);
            document.getElementById('currentDate').textContent = now.toLocaleDateString('en-US', dateOptions);
        }

        // Chart Data Management
        class LiveChart {
            constructor(canvasId, color, maxPoints = 50) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.color = color;
                this.maxPoints = maxPoints;
                this.dataPoints = [];
                this.animationFrame = null;
                
                this.setupCanvas();
                this.generateInitialData();
            }
            
            setupCanvas() {
                const rect = this.canvas.getBoundingClientRect();
                this.canvas.width = rect.width * window.devicePixelRatio;
                this.canvas.height = rect.height * window.devicePixelRatio;
                this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                this.canvas.style.width = rect.width + 'px';
                this.canvas.style.height = rect.height + 'px';
            }
            
            generateInitialData() {
                for (let i = 0; i < this.maxPoints; i++) {
                    this.dataPoints.push(Math.random() * 100);
                }
            }
            
            addDataPoint(value) {
                this.dataPoints.push(value);
                if (this.dataPoints.length > this.maxPoints) {
                    this.dataPoints.shift();
                }
            }
            
            draw() {
                const rect = this.canvas.getBoundingClientRect();
                const width = rect.width;
                const height = rect.height;
                
                this.ctx.clearRect(0, 0, width, height);
                
                if (this.dataPoints.length < 2) return;
                
                // Draw grid
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                this.ctx.lineWidth = 1;
                
                for (let i = 0; i <= 5; i++) {
                    const y = (height / 5) * i;
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, y);
                    this.ctx.lineTo(width, y);
                    this.ctx.stroke();
                }
                
                // Draw area under curve
                this.ctx.beginPath();
                this.ctx.moveTo(0, height);
                
                for (let i = 0; i < this.dataPoints.length; i++) {
                    const x = (width / (this.maxPoints - 1)) * i;
                    const y = height - (this.dataPoints[i] / 100) * height;
                    
                    if (i === 0) {
                        this.ctx.lineTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                }
                
                this.ctx.lineTo(width, height);
                this.ctx.closePath();
                
                const gradient = this.ctx.createLinearGradient(0, 0, 0, height);
                gradient.addColorStop(0, this.color + '40');
                gradient.addColorStop(1, this.color + '00');
                this.ctx.fillStyle = gradient;
                this.ctx.fill();
                
                // Draw line
                this.ctx.beginPath();
                this.ctx.strokeStyle = this.color;
                this.ctx.lineWidth = 3;
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';
                
                for (let i = 0; i < this.dataPoints.length; i++) {
                    const x = (width / (this.maxPoints - 1)) * i;
                    const y = height - (this.dataPoints[i] / 100) * height;
                    
                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                }
                
                this.ctx.stroke();
                
                // Draw dots on data points
                for (let i = 0; i < this.dataPoints.length; i++) {
                    const x = (width / (this.maxPoints - 1)) * i;
                    const y = height - (this.dataPoints[i] / 100) * height;
                    
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, i === this.dataPoints.length - 1 ? 4 : 2, 0, Math.PI * 2);
                    this.ctx.fillStyle = this.color;
                    this.ctx.fill();
                }
            }
        }

        // Initialize Charts
        const usersChart = new LiveChart('usersChart', '#10b981');
        const cpuChart = new LiveChart('cpuChart', '#3b82f6');
        const bandwidthChart = new LiveChart('bandwidthChart', '#8b5cf6');

        // Data Generation Functions
        function generateUsersData() {
            const baseUsers = 1200;
            const variation = Math.sin(Date.now() / 10000) * 200 + Math.random() * 100;
            return Math.max(800, baseUsers + variation);
        }

        function generateCPUData() {
            const baseCPU = 65;
            const variation = Math.sin(Date.now() / 8000) * 15 + Math.random() * 10;
            return Math.max(30, Math.min(95, baseCPU + variation));
        }

        function generateBandwidthData() {
            const baseBandwidth = 85;
            const variation = Math.sin(Date.now() / 12000) * 20 + Math.random() * 15;
            return Math.max(40, Math.min(100, baseBandwidth + variation));
        }

        // Update Functions
        function updateMetrics() {
            const users = Math.floor(generateUsersData());
            const cpu = Math.floor(generateCPUData());
            const bandwidth = generateBandwidthData();

            // Update display values
            document.getElementById('usersCount').textContent = users.toLocaleString();
            document.getElementById('cpuUsage').textContent = cpu + '%';
            document.getElementById('bandwidthChart').textContent = bandwidth.toFixed(1) + ' Mbps';

            // Update charts
            usersChart.addDataPoint((users - 800) / 8); // Normalize to 0-100
            cpuChart.addDataPoint(cpu);
            bandwidthChart.addDataPoint(bandwidth);
        }

        function animate() {
            usersChart.draw();
            cpuChart.draw();
            bandwidthChart.draw();
            requestAnimationFrame(animate);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            usersChart.setupCanvas();
            cpuChart.setupCanvas();
            bandwidthChart.setupCanvas();
        });

        // Start everything
        updateDateTime();
        setInterval(updateDateTime, 1000);
        setInterval(updateMetrics, 2000);
        animate();

        // Initial metrics update
        updateMetrics();
    </script>
